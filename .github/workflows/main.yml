name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Master
        uses: actions/checkout@v3.5.1  # Latest version as of now

      - name: Set up Python 3.x
        uses: actions/setup-python@v4.4.0  # Latest version as of now
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --user awscli

      - name: Production Build
        run: mkdocs build

      - name: Build PDFs of the guides
        run: scripts/build_pdfs.sh

      - name: List site directory
        run: ls -R site/

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.event_name != 'pull_request'
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: auditengine.org
          SOURCE_DIR: "site"
          DEST_DIR: "docs"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Invalidate CloudFront Cache
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation --distribution-id E276VE8ZNB4QSS --paths "/docs/*"
